name: Auto Merge PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:

    runs-on: ubuntu-latest

    steps:
      - name: Enable auto merge
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
