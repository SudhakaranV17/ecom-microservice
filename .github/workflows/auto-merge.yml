name: Auto Merge PR

on:
  workflow_run:
    workflows:
      - "PR Check"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Enable auto merge
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
